# /etc/logrotate.conf — Vajra OS log rotation
# Keep logs small to save disk space

weekly
rotate 4
create
compress
delaycompress
missingok
notifempty

# System logs
/var/log/syslog {
    daily
    rotate 7
    compress
    missingok
    notifempty
}

/var/log/auth.log {
    weekly
    rotate 8
    compress
    missingok
    notifempty
}

/var/log/kern.log {
    weekly
    rotate 4
    compress
    missingok
    notifempty
}

/var/log/vajra/vajra.log {
    weekly
    rotate 12
    compress
    missingok
    notifempty
    postrotate
        systemctl reload vajra-logger 2>/dev/null || true
    endscript
}

# Package manager logs
/var/log/dpkg.log {
    monthly
    rotate 12
    compress
    missingok
    notifempty
}

/var/log/apt/history.log {
    monthly
    rotate 12
    compress
    missingok
    notifempty
}

include /etc/logrotate.d
