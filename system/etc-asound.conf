# /etc/asound.conf — Vajra OS ALSA sound configuration
pcm.!default {
    type plug
    slave.pcm "dmix"
}
ctl.!default {
    type hw
    card 0
}
pcm.dmix {
    type dmix
    ipc_key 1024
    slave {
        pcm "hw:0,0"
        period_time 0
        period_size 1024
        buffer_size 4096
        rate 44100
    }
}
