# /etc/vajra-firewall.conf — Vajra OS default firewall rules
# Privacy-first: deny incoming, allow outgoing

# Default policy
DEFAULT_INPUT=DROP
DEFAULT_FORWARD=DROP
DEFAULT_OUTPUT=ACCEPT

# Allowed incoming
# Loopback
ALLOW_LOOPBACK=yes

# SSH (disabled by default for privacy; enable manually)
ALLOW_SSH=no
SSH_PORT=22

# mDNS for local network discovery (optional)
ALLOW_MDNS=no

# ICMP ping (allow for diagnostics)
ALLOW_PING=yes

# Established connections
ALLOW_ESTABLISHED=yes

# DNS responses
ALLOW_DNS_REPLIES=yes

# DHCP
ALLOW_DHCP=yes

# Logging
LOG_DROPPED=yes
LOG_LEVEL=limit

# Tor integration
ENABLE_TOR_PROXY=no
TOR_SOCKS_PORT=9050

# IPv6
ENABLE_IPV6=yes
