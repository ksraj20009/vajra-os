# /etc/vajra-power.conf — Vajra OS power management

[AC]
# When plugged in
cpu_governor=performance
screen_brightness=100
screen_blank_minutes=10
suspend_minutes=0
disk_spindown_minutes=0
usb_autosuspend=no

[BATTERY]
# On battery
cpu_governor=powersave
screen_brightness=40
screen_blank_minutes=2
suspend_minutes=10
disk_spindown_minutes=12
usb_autosuspend=yes

[CRITICAL]
# Battery critical level
critical_percent=5
action=hibernate

[LOW]
low_percent=15
action=notify

[LID]
# Laptop lid behavior
lid_close_action=suspend
lid_ac_action=blank

[USB]
usb_autosuspend_timeout=2

[BLUETOOTH]
# Disable Bluetooth when not in use (saves power + privacy)
bluetooth_auto_off=yes

[WAKE]
# Devices allowed to wake the system
wake_on_lan=no
wake_on_usb=yes
wake_on_keyboard=yes
