# /etc/sysctl.conf — Vajra OS kernel parameter tuning
# धर्मो रक्षति रक्षितः

# --- Privacy & Security ---
# Ignore ICMP redirects (prevent MITM)
net.ipv4.conf.all.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.conf.all.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0

# Log martian packets
net.ipv4.conf.all.log_martians = 1

# Syn-flood protection
net.ipv4.tcp_syncookies = 1
net.ipv4.tcp_max_syn_backlog = 2048
net.ipv4.tcp_synack_retries = 2

# Disable IP forwarding (unless router)
net.ipv4.ip_forward = 0
net.ipv6.conf.all.forwarding = 0

# RFC 1337 fix
net.ipv4.tcp_rfc1337 = 1

# --- Performance ---
# Virtual memory
vm.swappiness = 10
vm.vfs_cache_pressure = 50
vm.dirty_ratio = 10
vm.dirty_background_ratio = 5

# File handles
fs.file-max = 2097152
fs.inotify.max_user_watches = 524288
fs.inotify.max_user_instances = 512

# Socket buffers
net.core.rmem_max = 16777216
net.core.wmem_max = 16777216
net.ipv4.tcp_rmem = 4096 87380 16777216
net.ipv4.tcp_wmem = 4096 65536 16777216
net.core.netdev_max_backlog = 16384
net.core.somaxconn = 4096

# TCP optimization
net.ipv4.tcp_fastopen = 3
net.ipv4.tcp_congestion_control = bbr
net.core.default_qdisc = fq
net.ipv4.tcp_slow_start_after_idle = 0
net.ipv4.tcp_mtu_probing = 1

# Connection tracking
net.netfilter.nf_conntrack_max = 262144

# --- Desktop responsiveness ---
# Reduce latency
kernel.sched_autogroup_enabled = 1
kernel.sched_min_granularity_ns = 10000000
kernel.sched_wakeup_granularity_ns = 15000000

# Disable watchdog (desktop)
kernel.nmi_watchdog = 0

# Magic SysRq (safety)
kernel.sysrq = 1

# Core dumps (security)
kernel.core_pattern = |/usr/lib/systemd/systemd-coredump %p %a %e

# kptr_restrict (security)
kernel.kptr_restrict = 2
kernel.dmesg_restrict = 1

# --- User limits ---
# Max user processes (desktop)
kernel.threads-max = 65536

# BPF restricted (security)
kernel.unprivileged_bpf_disabled = 1
