# /etc/vajra.conf — Vajra OS main configuration
# India's Privacy-First AI-Powered Operating System

[identity]
VERSION=1.0
CODENAME=Dharmo
BRAND=Vajra OS
SANSKRIT_NAME=वज्र
MOTTO=Dharmo Rakshati Rakshitah

[user]
DEFAULT_USER=vajra
DEFAULT_SHELL=/bin/bash

[mode]
# beginner = safety guardrails, pro = full access
DEFAULT_MODE=beginner

[ai]
BUDDHI_ENABLED=yes
BUDDHI_LOCAL_ONLY=yes
BUDDHI_VOICE_INPUT=no
BUDDHI_WAKE_WORD=vajra

[privacy]
TELEMETRY=never
ANALYTICS=never
CLOUD_SYNC=never
CRASH_REPORTS=never
TOR_OPTIONAL=yes
DNS_PREFERENCE=1.1.1.1,8.8.8.8
DO_NOT_TRACK=yes

[update]
AUTO_CHECK=yes
AUTO_INSTALL=no
CHECK_INTERVAL_HOURS=6
CHANNEL=stable

[locale]
DEFAULT_LANG=en_IN
DEFAULT_ENCODING=UTF-8
INDIAN_LANGS=hi,ta,bn,gu,pa,kn,te,ml,mr,sa
TIMEZONE=Asia/Kolkata
CURRENCY=INR
DATE_FORMAT=dd/mm/yyyy

[features]
GST_CALCULATOR=yes
PANCHANG=yes
VEDIC_MATH=yes
AYURVEDA=yes
IRCTC_HELPER=yes
FESTIVAL_CALENDAR=yes
CYBERSECURITY_TOOLS=yes

[security]
FIREWALL_DEFAULT=deny-incoming
APPARMOR=yes
PASSWORD_MIN_LEN=8
LOCK_ON_SUSPEND=yes
