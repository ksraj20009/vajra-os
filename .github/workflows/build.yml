name: Custom Kernel Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'kernel/**'

permissions:
  contents: write

jobs:
  build-and-test-kernel:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential libncurses-dev bison flex \
            libssl-dev libelf-dev bc cpio kmod git qemu-system-x86
          python3 -m pip install --user pycdlib

      - name: Clone kernel source
        run: |
          git clone --depth=1 --branch v6.10 https://github.com/torvalds/linux.git kernel/linux

      - name: Apply Vajra OS patches
        run: |
          cd kernel/linux
          for patch in ../patches/*.patch; do
            if git apply "$patch"; then
              echo "[+] applied: $(basename "$patch")"
            else
              echo "[!] skipped: $(basename "$patch")"
            fi
          done

      - name: Apply Vajra OS kernel config
        run: |
          cd kernel/linux
          make defconfig
          while IFS= read -r line; do
            [[ "$line" =~ ^# ]] && continue
            [[ -z "$line" ]] && continue
            key="${line%%=*}"
            val="${line#*=}"
            val="${val%\"}"; val="${val#\"}"
            case "$val" in
              y) scripts/config --enable "$key" ;;
              n) scripts/config --disable "$key" ;;
              m) scripts/config --module "$key" ;;
              *) scripts/config --set-str "$key" "$val" ;;
            esac
          done < ../configs/vajra.config
          make olddefconfig
          echo "--- key config values ---"
          grep -E "CONFIG_LOCALVERSION=|CONFIG_DEFAULT_HOSTNAME=|CONFIG_SECURITY_APPARMOR=" .config

      - name: Build kernel
        run: |
          set -o pipefail
          cd kernel/linux
          make -j"$(nproc)" 2>&1 | tail -20
          test -s arch/x86/boot/bzImage || { echo "[-] FATAL: bzImage was not built"; exit 1; }
          echo "[+] bzImage: $(stat -c%s arch/x86/boot/bzImage) bytes"

      - name: Build modules and package
        run: |
          set -o pipefail
          cd kernel/linux
          make modules_install INSTALL_MOD_PATH="$GITHUB_WORKSPACE/output/modules" 2>&1 | tail -5
          cp arch/x86/boot/bzImage "$GITHUB_WORKSPACE/output/vajra-kernel-x86_64"
          cd "$GITHUB_WORKSPACE/output"
          tar czf vajra-kernel.tar.gz vajra-kernel-x86_64 modules/
          sha256sum vajra-kernel.tar.gz > vajra-kernel.tar.gz.sha256
          ls -la

      - name: Boot-test the custom kernel (QEMU)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download v1.0.0 --repo "$GITHUB_REPOSITORY" \
            --pattern vajra-os-1.0-amd64.iso --output vajra-os-1.0-amd64.iso
          python3 - << 'EOF'
          import pycdlib, subprocess, os, tempfile

          iso = pycdlib.PyCdlib()
          iso.open("vajra-os-1.0-amd64.iso")
          iso.get_file_from_iso(local_path="initramfs.cpio.gz", iso_path="/INITRAMF.CPG")
          iso.close()
          print("[+] initramfs extracted")

          log = tempfile.mktemp(suffix=".log")
          cmd = ["qemu-system-x86_64", "-m", "512", "-accel", "tcg",
                 "-kernel", "output/vajra-kernel-x86_64",
                 "-initrd", "initramfs.cpio.gz",
                 "-append", "console=ttyS0",
                 "-display", "none", "-monitor", "none",
                 "-serial", "file:" + log,
                 "-no-reboot"]
          try:
              subprocess.run(cmd, timeout=600,
                              stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
          except subprocess.TimeoutExpired:
              pass  # expected - the OS drops to an interactive shell
          out = open(log, errors="replace").read() if os.path.exists(log) else ""
          print("---- serial console (tail) ----")
          print(out[-2500:])
          for marker in ["VAJRA OS 1.0", "Dharmo Rakshati Rakshitah"]:
              assert marker in out, f"BOOT TEST FAILED: missing {marker!r}"
          assert "-vajra" in out, "BOOT TEST FAILED: custom kernel version string not in uname -r"
          print("[+] CUSTOM KERNEL BOOT TEST PASSED - v6.10-vajra boots to the Vajra OS shell")
          EOF

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: vajra-kernel
          path: output/vajra-kernel.tar.gz
          retention-days: 90

      - name: Upload kernel to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v1.0.0 \
            output/vajra-kernel.tar.gz output/vajra-kernel.tar.gz.sha256 \
            --clobber --repo "$GITHUB_REPOSITORY"
          echo "[+] vajra-kernel.tar.gz published to the v1.0.0 release"
