name: Custom Kernel Build

on:
  workflow_dispatch:
  push:
    paths:
      - 'kernel/**'
      - 'scripts/build-kernel.sh'

permissions:
  contents: write

jobs:
  build-and-test-kernel:
    runs-on: ubuntu-22.04
    timeout-minutes: 300
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential libncurses-dev bison flex \
            libssl-dev libelf-dev bc cpio kmod git qemu-system-x86
          python3 -m pip install --user pycdlib

      - name: Build the custom kernel
        run: bash scripts/build-kernel.sh vajra-kernel-out

      - name: Package kernel
        run: |
          cd vajra-kernel-out
          tar czf vajra-kernel.tar.gz vajra-kernel-x86_64 modules/
          sha256sum vajra-kernel.tar.gz > vajra-kernel.tar.gz.sha256
          ls -la

      - name: Boot-test the custom kernel (QEMU)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download v1.0.0 --repo "$GITHUB_REPOSITORY" \
            --pattern vajra-os-1.0-amd64.iso --output vajra-os-1.0-amd64.iso
          python3 - << 'EOF'
          import pycdlib, subprocess, os, tempfile

          iso = pycdlib.PyCdlib()
          iso.open("vajra-os-1.0-amd64.iso")
          iso.get_file_from_iso(local_path="initramfs.cpio.gz", iso_path="/INITRAMF.CPG")
          iso.close()
          print("[+] initramfs extracted")

          log = tempfile.mktemp(suffix=".log")
          cmd = ["qemu-system-x86_64", "-m", "512", "-accel", "tcg",
                 "-kernel", "vajra-kernel-out/vajra-kernel-x86_64",
                 "-initrd", "initramfs.cpio.gz",
                 "-append", "console=ttyS0",
                 "-display", "none", "-monitor", "none",
                 "-serial", "file:" + log,
                 "-no-reboot"]
          try:
              subprocess.run(cmd, timeout=600,
                              stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL)
          except subprocess.TimeoutExpired:
              pass  # expected - the OS drops to an interactive shell
          out = open(log, errors="replace").read() if os.path.exists(log) else ""
          print("---- serial console (tail) ----")
          print(out[-2500:])
          for marker in ["VAJRA OS 1.0", "Dharmo Rakshati Rakshitah"]:
              assert marker in out, f"BOOT TEST FAILED: missing {marker!r}"
          assert "-vajra" in out, "BOOT TEST FAILED: custom kernel version string not in uname -r"
          print("[+] CUSTOM KERNEL BOOT TEST PASSED - v6.12-vajra boots to the Vajra OS shell")
          EOF

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v4
        with:
          name: vajra-kernel
          path: vajra-kernel-out/vajra-kernel.tar.gz
          retention-days: 90

      - name: Upload kernel to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v1.0.0 \
            vajra-kernel-out/vajra-kernel.tar.gz vajra-kernel-out/vajra-kernel.tar.gz.sha256 \
            --clobber --repo "$GITHUB_REPOSITORY"
          echo "[+] vajra-kernel.tar.gz published to the v1.0.0 release"
