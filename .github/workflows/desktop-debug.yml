name: Desktop Debug

on:
  workflow_dispatch:

jobs:
  diagnose-lb-chroot:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Run live-build and autopsy the chroot on failure
        run: |
          docker run --privileged --rm -v "$PWD/live-build:/lb" debian:trixie bash -exc '
            export DEBIAN_FRONTEND=noninteractive HOME=/root
            apt-get update -qq
            apt-get install -y -qq live-build debootstrap gnupg wget ca-certificates >/dev/null
            cd /lb
            lb config
            echo "===== running lb build ====="
            lb build --verbose > /tmp/lb.log 2>&1 || echo "BUILD FAILED (expected for diagnostics)"
            grep -n "not bound\|not signed\|E: " /tmp/lb.log | head -10 || true
            echo "===== chroot state ====="
            ls -la chroot/etc/apt/trusted.gpg.d/ 2>/dev/null || echo "(no chroot)"
            echo "--- sources ---"
            ls chroot/etc/apt/sources.list.d/ 2>/dev/null || true
            cat chroot/etc/apt/sources.list.d/*.list 2>/dev/null || true
            echo "--- key checksums (chroot vs repo) ---"
            sha256sum chroot/etc/apt/trusted.gpg.d/vajra* config/archives/vajra.key.chroot 2>/dev/null
            echo "--- chroot apt/sqv versions ---"
            chroot chroot dpkg-query -W apt sqv sequoia-openpgp 2>&1 || true
            echo "===== sqv verdict INSIDE the chroot ====="
            wget -qO chroot/tmp/InRelease https://ksraj20009.github.io/vajra-os/apt-repo/dists/vajra/InRelease
            chroot chroot sqv --keyring /etc/apt/trusted.gpg.d/vajra.key.chroot.asc --output /dev/null /tmp/InRelease 2>&1 | head -8 || true
            echo "===== apt update INSIDE the chroot, manually ====="
            chroot chroot apt-get update 2>&1 | grep -E "vajra|Err|sqv|not signed" | head -8 || true
            echo "DIAG-DONE"
          '
