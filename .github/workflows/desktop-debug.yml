name: Desktop Debug

on:
  workflow_dispatch:

jobs:
  diagnose-lb-chroot:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Diff the crypto policy between container and chroot
        run: |
          docker run --privileged --rm -v "$PWD/live-build:/lb" debian:trixie bash -exc '
            export DEBIAN_FRONTEND=noninteractive HOME=/root
            apt-get update -qq
            apt-get install -y -qq live-build debootstrap gnupg wget ca-certificates >/dev/null
            cd /lb
            lb config
            lb build --verbose > /tmp/lb.log 2>&1 || echo "build failed (expected)"
            echo "===== where in lb.log it failed ====="
            sed -n "860,905p" /tmp/lb.log
            echo "===== container vs chroot: crypto-policies ====="
            echo "--- container /etc/crypto-policies/back-ends/ ---"
            ls -la /etc/crypto-policies/back-ends/ 2>&1 || echo "(dir missing)"
            cat /etc/crypto-policies/back-ends/apt-sequoia.config 2>/dev/null || echo "(no override in container)"
            echo "--- chroot /etc/crypto-policies/back-ends/ ---"
            ls -la chroot/etc/crypto-policies/back-ends/ 2>&1 || echo "(dir missing)"
            cat chroot/etc/crypto-policies/back-ends/apt-sequoia.config 2>/dev/null || echo "(no override in chroot)"
            echo "===== chroot /etc/apt/apt.conf.d/ ====="
            ls chroot/etc/apt/apt.conf.d/
            grep -r "" chroot/etc/apt/apt.conf.d/ 2>/dev/null | head -30
            echo "===== sqv flags ====="
            chroot chroot sqv --help 2>&1 | head -25
            echo "===== sqv verdicts ====="
            wget -qO chroot/tmp/InRelease https://ksraj20009.github.io/vajra-os/apt-repo/dists/vajra/InRelease
            echo "--- sqv in CHROOT, cleartext, no time:"
            chroot chroot sqv --keyring /etc/apt/trusted.gpg.d/vajra.key.chroot.asc --cleartext --output /dev/null /tmp/InRelease 2>&1 | head -6; echo "exit=$?"
            echo "--- sqv in CHROOT, cleartext, time = InRelease date:"
            chroot chroot sqv --keyring /etc/apt/trusted.gpg.d/vajra.key.chroot.asc --time 2026-09-27T14:26:45Z --cleartext --output /dev/null /tmp/InRelease 2>&1 | head -6; echo "exit=$?"
            echo "--- sqv in CONTAINER(host), cleartext, same keyring+file:"
            sqv --keyring /lb/chroot/etc/apt/trusted.gpg.d/vajra.key.chroot.asc --cleartext --output /dev/null /lb/chroot/tmp/InRelease 2>&1 | head -6; echo "exit=$?"
            echo "DIAG-DONE"
          '
