name: Desktop Debug

on:
  workflow_dispatch:

jobs:
  diagnose-policy:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Is crypto-policies the trigger for the sqv rejection
        run: |
          docker run --rm debian:trixie bash -exc '
            export DEBIAN_FRONTEND=noninteractive HOME=/root
            apt-get update -qq
            apt-get install -y -qq wget ca-certificates >/dev/null
            cd /tmp
            wget -qO key.asc https://raw.githubusercontent.com/ksraj20009/vajra-os/gh-pages/apt-repo/vajra-archive-keyring.asc
            gpg_dummy() { :; }
            mkdir -p /etc/apt/trusted.gpg.d
            printf "deb https://ksraj20009.github.io/vajra-os/apt-repo vajra main\n" > /etc/apt/sources.list.d/vajra.list

            echo "===== BASELINE: dearmored .gpg, apt update, NO gnupg (sqv path) ====="
            apt-get install -y -qq gpgv >/dev/null || true
            # dearmor without gnupg: use apt helper
            apt-get install -y -qq gnupg >/dev/null
            gpg --dearmor < key.asc > /etc/apt/trusted.gpg.d/vajra.gpg
            apt-get purge -y -qq gnupg gpgv >/dev/null || true
            dpkg -l gnupg gpgv 2>&1 | tail -2 || true
            apt-get update -o Debug::Acquire::sqv=1 2>&1 | grep -E "SEQUOIA|Executing sqv|vajra|Err|sqv|not signed|GOODSIG" | head -12
            echo "BASELINE exit: ${PIPESTATUS[0]}"

            echo "===== crypto-policies present? ====="
            ls -la /var/lib/crypto-config/profiles/current/ 2>&1 || echo "(no crypto-config)"
            cat /var/lib/crypto-config/profiles/current/apt-sequoia.config 2>/dev/null || echo "(no apt-sequoia.config yet)"

            echo "===== INSTALL crypto-policies, retest ====="
            apt-get install -y -qq crypto-policies >/dev/null
            ls -la /var/lib/crypto-config/profiles/current/ 2>&1 || echo "(still none)"
            cat /var/lib/crypto-config/profiles/current/apt-sequoia.config 2>/dev/null || echo "(no apt-sequoia.config)"
            rm -rf /var/lib/apt/lists/*
            apt-get update -o Debug::Acquire::sqv=1 2>&1 | grep -E "SEQUOIA|Executing sqv|vajra|Err|sqv|not signed|GOODSIG" | head -12
            echo "CRYPTO-POLICIES exit: ${PIPESTATUS[0]}"

            echo "===== manual sqv with that policy, both forms ====="
            wget -qO InRelease https://ksraj20009.github.io/vajra-os/apt-repo/dists/vajra/InRelease
            rm -f o1 o2
            SEQUOIA_CRYPTO_POLICY=/var/lib/crypto-config/profiles/current/apt-sequoia.config sqv --keyring /etc/apt/trusted.gpg.d/vajra.gpg --cleartext --output o1 InRelease && echo "SQV-WITH-POLICY: ACCEPTED" || echo "SQV-WITH-POLICY: REJECTED"
            SEQUOIA_CRYPTO_POLICY=/usr/share/apt/default-sequoia.config sqv --keyring /etc/apt/trusted.gpg.d/vajra.gpg --cleartext --output o2 InRelease && echo "SQV-APT-DEFAULT: ACCEPTED" || echo "SQV-APT-DEFAULT: REJECTED"
            echo "DIAG-DONE"
          '
