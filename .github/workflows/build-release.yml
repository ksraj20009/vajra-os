name: Build Release Artifacts

on:
  workflow_dispatch:
  push:
    paths:
      - 'core/**'
      - 'ai/**'
      - 'apps/**'
      - 'branding/**'
      - 'packaging/**'
      - 'iso/**'
      - 'scripts/ci-build-release.sh'
      - '.github/workflows/build-release.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run full release build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci-build-release.sh
