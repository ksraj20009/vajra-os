# ============================================================================
# Vajra OS — Secure DNS Configuration
# वज्र OS — डीएनएस सुरक्षा कॉन्फ़िगरेशन
#
# Encrypted DNS (DNS-over-TLS) for installed systems using systemd-resolved.
# Install as:  /etc/systemd/resolved.conf.d/vajra-dns.conf
# then:        sudo systemctl restart systemd-resolved
#
# The resolvers below log little to nothing and support DNS-over-TLS:
#   Quad9 (swiss, malware filtering)   9.9.9.9 / 2620:fe::fe
#   Cloudflare (1.1.1.1)               1.1.1.1 / 2606:4700:4700::1111
#   Google                             8.8.8.8 / 2001:4860:4860::8888
# ============================================================================

[Resolve]
# Primary: Quad9 with DNS-over-TLS (also blocks known malware domains)
DNS=9.9.9.9#dns.quad9.net
DNS=2620:fe::fe#dns.quad9.net

# Fallbacks (used if the primaries are unreachable)
FallbackDNS=1.1.1.1#cloudflare-dns.com 8.8.8.8#dns.google

# Opportunistic encryption: uses TLS when the resolver supports it,
# plain DNS otherwise. Set to "strict" once you know your network
# allows it — strict fails closed rather than leaking queries.
DNSOverTLS=opportunistic

# Validate DNSSEC; allow-downgrade keeps resolution working on
# broken middleboxes instead of failing hard.
DNSSEC=allow-downgrade

# Local cache speeds up repeated lookups
Cache=yes

# ----------------------------------------------------------------------------
# Live ISO note: the live system uses BusyBox, which has no DNS cache.
# /etc/resolv.conf there is written by udhcpc. To use these resolvers in
# the live session:
#     echo "nameserver 9.9.9.9" > /etc/resolv.conf
#
# Related tools in this repo:
#   privacy/harden.sh            — applies this file on installed systems
#   privacy/privacy-dashboard.sh — shows which resolvers are in use
# ----------------------------------------------------------------------------
