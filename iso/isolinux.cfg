# ISOLINUX configuration for Vajra OS
UI vesamenu.c32
PROMPT 0
TIMEOUT 50
DEFAULT vajra

MENU TITLE Vajra OS 1.0 - India's Privacy-First AI-Powered OS
MENU BACKGROUND vajra.png
MENU COLOR title 1;37;44 #FFFFFFFF #00000000
MENU COLOR border 30;44 #FFFFFFFF #00000000
MENU COLOR sel 7;37;40 #FF000000 #FFFFFFFF
MENU COLOR unsel 37;44 #FFFFFFFF #00000000
MENU COLOR help 37;40 #FFFFFFFF #00000000
MENU COLOR timeout_msg 37;40 #FFFFFFFF #00000000
MENU COLOR timeout 1;37;40 #FFFF0000 #00000000

LABEL vajra
    MENU LABEL ^Vajra OS 1.0 (Beginner Mode)
    MENU DEFAULT
    KERNEL /boot/vmlinuz
    APPEND initrd=/boot/initrd.img root=/dev/ram0 rw quiet splash vajra.mode=beginner

LABEL vajra-pro
    MENU LABEL Vajra OS 1.0 (^Pro Mode)
    KERNEL /boot/vmlinuz
    APPEND initrd=/boot/initrd.img root=/dev/ram0 rw quiet splash vajra.mode=pro

LABEL vajra-safe
    MENU LABEL Vajra OS 1.0 (^Safe Mode)
    KERNEL /boot/vmlinuz
    APPEND initrd=/boot/initrd.img root=/dev/ram0 rw single vajra.mode=beginner

LABEL vajra-recovery
    MENU LABEL Vajra OS 1.0 (Recovery)
    KERNEL /boot/vmlinuz
    APPEND initrd=/boot/initrd.img root=/dev/ram0 ro single recovery

MENU SEPARATOR
LABEL memtest
    MENU LABEL ^Memory Test
    KERNEL /boot/memtest86+.bin

LABEL hd
    MENU LABEL ^Boot from Hard Drive
    LOCALBOOT 0x80
