# UEFI GRUB configuration for Vajra OS ISO
set default=0
set timeout=5

insmod all_video
insmod gfxterm
set gfxmode=auto
terminal_output gfxterm

menuentry "Vajra OS 1.0 (Beginner Mode)" {
    linux /boot/vmlinuz root=/dev/ram0 rw quiet splash vajra.mode=beginner
    initrd /boot/initrd.img
}

menuentry "Vajra OS 1.0 (Pro Mode)" {
    linux /boot/vmlinuz root=/dev/ram0 rw quiet splash vajra.mode=pro
    initrd /boot/initrd.img
}

menuentry "Vajra OS 1.0 (Safe Mode)" {
    linux /boot/vmlinuz root=/dev/ram0 rw single vajra.mode=beginner
    initrd /boot/initrd.img
}

menuentry "Memory Test" {
    linux16 /boot/memtest86+.bin
}
