# /boot/grub/grub.cfg — Vajra OS GRUB boot menu
set default=0
set timeout=5
set menu_color_normal=white/black
set menu_color_highlight=yellow/black

# Vajra OS theme
insmod all_video
insmod gfxterm
insmod png
set gfxmode=auto
terminal_input console
terminal_output gfxterm

# Load Vajra theme if available
if [ -f /boot/grub/themes/vajra/theme.txt ]; then
    set theme=/boot/grub/themes/vajra/theme.txt
fi

menuentry "Vajra OS 1.0 (Normal Boot)" {
    set root=(hd0,1)
    linux /boot/vmlinuz root=/dev/ram0 rw quiet splash vajra.mode=beginner
    initrd /boot/initrd.img
}

menuentry "Vajra OS 1.0 (Pro Mode)" {
    set root=(hd0,1)
    linux /boot/vmlinuz root=/dev/ram0 rw quiet splash vajra.mode=pro
    initrd /boot/initrd.img
}

menuentry "Vajra OS 1.0 (Safe Mode)" {
    set root=(hd0,1)
    linux /boot/vmlinuz root=/dev/ram0 rw single vajra.mode=beginner
    initrd /boot/initrd.img
}

menuentry "Vajra OS 1.0 (Recovery)" {
    set root=(hd0,1)
    linux /boot/vmlinuz root=/dev/ram0 ro single recovery
    initrd /boot/initrd.img
}
